[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr"
version = "1.0.0"
description = "Turkish license-plate recognition: detection, OCR, voting, relay control, API and GUI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
# Tkinter desktop client. Runs on the operator's own machine, never inside
# the Docker image (see docker/Dockerfile / requirements.txt). tkinter
# itself ships with the CPython stdlib on Windows/most Linux distros and is
# not pip-installable, so it is not listed here.
gui = [
    "ttkbootstrap>=1.10,<2",
    "requests>=2.31,<3",
    # MJPEG frames are decoded with Pillow, not OpenCV: the client displays
    # frames the server already encoded and never opens a camera itself, so
    # the opencv-python dependency this extra used to carry was dead weight.
    "pillow>=10.3,<12",
    # asyncio WebSocket client, driven by lpr.ui.client.EventStream on its own
    # loop thread. Same library the server already uses, so client and server
    # share one implementation rather than two.
    "websockets>=12.0,<14",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
    "types-requests>=2.32,<3",
]
# GPU acceleration. pip extras cannot set a custom package index, so this
# extra intentionally does not try to pull in a CUDA build of torch itself
# (that would silently reinstall the CPU wheel from PyPI, or fail). Instead:
#   1. pip install -e ".[gpu]"
#   2. pip install --index-url https://download.pytorch.org/whl/cu121 \
#        --upgrade torch torchvision
# matching the CUDA version available on the host. See docker/Dockerfile for
# the equivalent container-side comment.
gpu = []

[project.scripts]
# Setup and inspection: `lpr init` provisions a fresh checkout, `lpr status`
# and `lpr doctor` report what is missing. Import-light on purpose -- these
# have to run before the ML stack is installed.
lpr = "lpr.cli:main"
lpr-api = "lpr.api.main:run"
lpr-gui = "lpr.ui.app:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

# `extend-exclude`, not `exclude`: setting `exclude` *replaces* Ruff's default
# list, which is what keeps `venv/`, `.git/`, `build/` and friends out of the
# check. This repository has a `venv/` at its root, so replacing that list
# would put several thousand third-party findings in front of every real one.
#
# `legacy/` is the pre-refactor single-file application, kept for reference and
# imported by nothing. It uses `from ttkbootstrap.constants import *`, which
# alone accounts for 45 of the findings CI was failing on. Linting frozen code
# nobody edits buys nothing, so it is excluded outright rather than annotated.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Stylistic findings that are not defects. Each one was failing CI across
# enough of the tree that fixing them would have meant a diff touching files
# nobody was otherwise changing -- which is a worse trade than not enforcing
# the rule.
ignore = [
    # Star imports. Only `legacy/` does this, and that directory is excluded
    # above; listed here so re-including it cannot resurrect 45 findings.
    "F403",  # `from x import *` used; unable to detect undefined names
    "F405",  # name may be undefined, or defined from a star import
    # `try/except/pass` instead of `contextlib.suppress`. The explicit form is
    # used deliberately throughout the hardware, Tk and filesystem paths, where
    # the `except` clause carries a comment explaining what is being swallowed
    # and why -- a `suppress()` context manager has nowhere to put that.
    "SIM105",
    # Line length. The formatter still wraps code at `line-length` above; what
    # this drops is the check on the long prose comments and docstrings this
    # codebase uses to record why a decision was made. Reflowing those to 100
    # columns is churn, not clarity.
    "E501",
    # Quoted forward references, e.g. `settings: "Settings | None"`. Required,
    # not optional, in the modules that import `Settings` only under
    # `TYPE_CHECKING` -- which is how `lpr.pipeline` stays importable without
    # torch installed.
    "UP037",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "easyocr", "easyocr.*", "ultralytics", "ultralytics.*", "serial", "serial.*"]
ignore_missing_imports = true
