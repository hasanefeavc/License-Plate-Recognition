[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr"
version = "1.0.0"
description = "Turkish license-plate recognition: detection, OCR, voting, relay control, API and GUI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
# Tkinter desktop client. Runs on the operator's own machine, never inside
# the Docker image (see docker/Dockerfile / requirements.txt). tkinter
# itself ships with the CPython stdlib on Windows/most Linux distros and is
# not pip-installable, so it is not listed here.
gui = [
    "ttkbootstrap>=1.10,<2",
    "requests>=2.31,<3",
    # MJPEG frames are decoded with Pillow, not OpenCV: the client displays
    # frames the server already encoded and never opens a camera itself, so
    # the opencv-python dependency this extra used to carry was dead weight.
    "pillow>=10.3,<12",
    # asyncio WebSocket client, driven by lpr.ui.client.EventStream on its own
    # loop thread. Same library the server already uses, so client and server
    # share one implementation rather than two.
    "websockets>=12.0,<14",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
    "types-requests>=2.32,<3",
]
# GPU acceleration. pip extras cannot set a custom package index, so this
# extra intentionally does not try to pull in a CUDA build of torch itself
# (that would silently reinstall the CPU wheel from PyPI, or fail). Instead:
#   1. pip install -e ".[gpu]"
#   2. pip install --index-url https://download.pytorch.org/whl/cu121 \
#        --upgrade torch torchvision
# matching the CUDA version available on the host. See docker/Dockerfile for
# the equivalent container-side comment.
gpu = []

[project.scripts]
# Setup and inspection: `lpr init` provisions a fresh checkout, `lpr status`
# and `lpr doctor` report what is missing. Import-light on purpose -- these
# have to run before the ML stack is installed.
lpr = "lpr.cli:main"
lpr-api = "lpr.api.main:run"
lpr-gui = "lpr.ui.app:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "easyocr", "easyocr.*", "ultralytics", "ultralytics.*", "serial", "serial.*"]
ignore_missing_imports = true
