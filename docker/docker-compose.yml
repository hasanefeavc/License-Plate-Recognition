services:
  lpr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lpr-api:latest
    container_name: lpr-api
    restart: unless-stopped
    user: "0:0"
    network_mode: "host"
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../config.yaml:/app/config.yaml:ro
      - ..:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LPR_SYSTEM_UPDATE__REPO_DIR: /repo
    env_file:
      - path: ../.env
        required: false
