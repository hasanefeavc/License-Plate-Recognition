# Production stack. Unprivileged, network-isolated, no engine socket.
#
# Two overlays add back what this file deliberately leaves out. Neither is on
# by default, because each trades away part of the isolation here:
#
#   docker-compose.ota.yml    in-app updates. Mounts the engine socket, which
#                             is host-root access, and the repo checkout.
#   docker-compose.proxy.yml  TLS termination, security headers and the public
#                             port. This file publishes only to loopback.
#   docker-compose.cdi.yml    GPU passthrough on Podman / CDI hosts.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.proxy.yml up -d

services:
  lpr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Which PyTorch wheels go into the image. The default in the Dockerfile
        # is the CPU index; this override pulls the CUDA 12.4 build so
        # torch.cuda.is_available() is true inside the container.
        #
        # The base image stays python:slim -- no nvidia/cuda image is needed.
        # The CUDA runtime libraries ship *inside* these wheels (as the
        # nvidia-*-cu12 dependencies), and the host driver is injected by the
        # NVIDIA container toolkit, so the two halves meet without a CUDA base
        # layer. Cost is image size: ~2.5 GB against ~800 MB for CPU.
        #
        # Override per host if the driver is too old for cu124:
        #   TORCH_INDEX_URL=https://download.pytorch.org/whl/cu121 \
        #     docker compose -f docker/docker-compose.yml build
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
    image: lpr-api:latest
    container_name: lpr-api
    restart: unless-stopped

    # --- Identity ----------------------------------------------------------
    #
    # Runs as the unprivileged `lpr` user baked into the image (uid 1000).
    # This block used to say `user: "0:0"`, which undid the Dockerfile's USER
    # line and made the container root -- and, with the engine socket mounted,
    # host root. Camera access comes from a supplementary group instead, which
    # is the whole reason the override was there.
    #
    # `video` is gid 44 on Debian and Ubuntu. Check the host with
    # `getent group video` and override when it differs:
    #   LPR_VIDEO_GID=27 docker compose -f docker/docker-compose.yml up -d
    group_add:
      - "${LPR_VIDEO_GID:-44}"

    security_opt:
      - no-new-privileges:true

    # --- Network -----------------------------------------------------------
    #
    # One published port, on loopback by default. This used to be
    # `network_mode: host`, which put the container on the host's network
    # stack with no isolation and bound the API to every interface -- with no
    # TLS and no rate limiting.
    #
    # 127.0.0.1 because the intended front door is the reverse proxy in
    # docker-compose.proxy.yml. A site that genuinely wants the API exposed
    # directly sets LPR_BIND=0.0.0.0 and accepts serving JWTs over plain HTTP.
    ports:
      - "${LPR_BIND:-127.0.0.1}:${LPR_PORT:-8000}:8000"

    # --- Devices -----------------------------------------------------------
    #
    # Empty by default. The old file hard-coded /dev/video0 and /dev/video1,
    # so an RTSP-only site -- or one with a single camera -- could not start
    # the stack at all: Compose fails container-create on a device that does
    # not exist. Add what this site actually has:
    #
    #   docker compose -f docker/docker-compose.yml \
    #     -f docker/docker-compose.usb.yml up -d
    #
    # or write the device into a local override file.
    devices: []

    volumes:
      - ../data:/app/data
      # Holds the YOLO weights *and*, under easyocr/, the EasyOCR detection and
      # recognition networks (see LPR_OCR__MODEL_DIR below). Both are large and
      # neither is in the image, so this bind mount is what makes a cold start
      # offline-capable.
      - ../models:/app/models
      # EasyOCR's built-in default location, mounted as well as configured.
      # Belt and braces: any code path that ignores model_storage_directory
      # still writes to the host instead of to a container layer that the next
      # `up --build` deletes.
      #
      # Under /home/lpr, not /root: the container is no longer root, and a
      # cache pointed at a home directory the process cannot write is a
      # silent re-download on every start.
      - ../data/easyocr_cache:/home/lpr/.EasyOCR
      - ../data/torch_cache:/home/lpr/.cache/torch
      - ../config.yaml:/app/config.yaml:ro

    environment:
      # Production unless the operator deliberately says otherwise. This is what
      # arms the checks that only make sense on a real site: the refusal to boot
      # with the shipped `change-me` signing key, the refusal to serve wildcard
      # CORS, and switching /docs and /openapi.json off. None of them used to
      # fire under compose, because nothing set this and the default was "not
      # production" -- so a site that never wrote a .env got the development
      # posture without ever having chosen it.
      #
      # `LPR_ENV=development docker compose up` still opts out for a bench box.
      LPR_ENV: ${LPR_ENV:-production}
      # Put the OCR weights on the models/ volume rather than in $HOME, so they
      # survive `docker compose up --build`. Without this every rebuild
      # re-downloaded ~100 MB before the first frame could be processed, and a
      # dropped link at that moment hung startup.
      LPR_OCR__MODEL_DIR: /app/models/easyocr
      TORCH_HOME: /app/models/torch
      # Consumed by the NVIDIA container runtime. The deploy.resources block
      # below is what actually requests the device under `docker compose up`;
      # these two keep `docker run --runtime=nvidia` and older toolkit versions
      # working with the same image.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    env_file:
      - path: ../.env
        required: false

    # --- Liveness ----------------------------------------------------------
    #
    # A wedged-but-alive process is the failure `restart: unless-stopped`
    # cannot see on its own, and the Dockerfile's HEALTHCHECK was never being
    # acted on. start_period is long because a cold start loads torch and the
    # EasyOCR weights before it serves.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

    # --- Resource ceilings -------------------------------------------------
    #
    # A leak in the container must not take the host down with it. Generous on
    # purpose: torch plus the EasyOCR weights is ~2 GB resident before a frame
    # is decoded, and an OOM kill mid-pulse is worse than swapping.
    mem_limit: ${LPR_MEM_LIMIT:-6g}
    pids_limit: 512

    # --- GPU passthrough ---------------------------------------------------
    #
    # Requires the NVIDIA Container Toolkit on the host:
    #   sudo apt install nvidia-container-toolkit
    #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
    # Verify the *device* actually reaches the container -- not just that the
    # container started:
    #   docker compose -f docker/docker-compose.yml run --rm lpr-api \
    #     python -c "import torch; print(torch.cuda.is_available())"
    #
    # This reservation is the Docker Engine spelling, and on Docker Engine it
    # is a hard requirement: with no nvidia runtime registered, `up` fails at
    # container-create rather than starting on CPU. That is the right default
    # for a gate box, because a silent drop to CPU is a 10x slowdown that looks
    # like a healthy service. On Podman it is accepted and silently ignored --
    # use docker-compose.cdi.yml there.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
