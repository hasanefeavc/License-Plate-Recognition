# LPR configuration.
app:
  name: lpr
  headless: true
  log_level: INFO
  data_dir: data
  models_dir: models

cameras:
  # Single-camera site: entry owns the only webcam, exit is left blank so the
  # orchestrator skips it. Two roles must never name the same device -- "0" and
  # "/dev/video0" are the same camera, and V4L2 gives exclusive access to
  # whichever thread opens it first, leaving the other in a reconnect loop.
  entry:
    source: "0"
    width: 640
    height: 480
    fps_limit: 30
    # First reconnect delay; later attempts back off exponentially (with
    # jitter, so several cameras behind one NVR do not retry in lockstep) up
    # to reconnect_max_delay_s.
    reconnect_delay_s: 5.0
    reconnect_max_delay_s: 60.0
    # Seconds without a frame before the watchdog forces a reconnect. This is
    # the guard against the failure that takes a gate offline silently: a TCP
    # connection that stays open while the camera stops sending. read() has no
    # timeout of its own, so the capture thread parks forever, /health keeps
    # answering 200, and the barrier simply never opens again.
    stall_timeout_s: 15.0
    # RTSP only. tcp rather than FFmpeg's default udp: on a congested or
    # wifi-bridged link udp drops packets and produces torn frames, which
    # surface as OCR errors that are really decode errors.
    rtsp_transport: tcp
    # FFmpeg socket timeout, in seconds. Passed as stimeout (microseconds) via
    # OPENCV_FFMPEG_CAPTURE_OPTIONS -- the only way in, since OpenCV exposes no
    # API for it. Catches a stalled stream before the watchdog has to.
    open_timeout_s: 5.0
    # Frames held between capture and recognition. Deliberately shallow: the
    # queue drops its oldest entry when full, so a deep queue does not buy
    # throughput, it buys latency -- recognition works through stale frames and
    # falls further behind the live view. 2 is one frame in hand plus one being
    # worked on.
    queue_size: 2
  exit:
    source: ""
    width: 640
    height: 480
    fps_limit: 30
    reconnect_delay_s: 5.0
    reconnect_max_delay_s: 60.0
    stall_timeout_s: 15.0
    rtsp_transport: tcp
    open_timeout_s: 5.0
    queue_size: 2
  motion:
    enabled: true
    threshold: 3000
    heartbeat_s: 3.0

detection:
  # Blank = models/plate_yolov8n.pt. The file currently in models/ is the stock
  # COCO baseline (80 classes, no plate class), so the pipeline detects it at
  # startup and falls back to the contour detector rather than sending a crop of
  # every car and person to OCR. Point this at a real plate fine-tune to get
  # accuracy back.
  model_path: ""
  confidence: 0.35
  iou: 0.5
  # auto = use CUDA when a GPU is genuinely usable, CPU otherwise. Prefer this
  # over a hard "0"/"cuda:0": the probe in lpr.accel launches a real kernel
  # before answering, so a CPU-only torch wheel or a driver/runtime mismatch
  # comes back as CPU at startup instead of as a crash on the first frame --
  # and that crash used to surface as the *contour* detector silently taking
  # over, which reads far fewer plates. Pin an ordinal ("0", "cuda:1") only to
  # choose between several cards.
  device: auto
  imgsz: 640
  # Detect on 1 frame in 5. The motion gate already drops still frames; this
  # thins what is left so a car crossing the field of view is still sampled
  # several times without paying for every frame.
  frame_stride: 5
  # Contour-detector edge pass runs at this width; boxes are scaled back and
  # crops still come from the full-resolution frame. YOLO uses imgsz instead.
  downscale_width: 640
  # Most crops from one frame allowed to reach OCR, best-scoring first. OCR is
  # ~400 ms per crop on this CPU, so an uncapped frame with ten candidates
  # stalls the pipeline for seconds.
  max_ocr_candidates: 3
  track: true
  tracker: bytetrack.yaml
  prefer_onnx: true

preprocess:
  frame_enhance: false
  frame_clahe_clip: 2.0
  frame_unsharp_amount: 0.5
  crop_unsharp_amount: 0.6
  normalize_lighting: true
  rectify_perspective: true
  hard_case_variants: true
  escalate_below_confidence: 0.5
  # Offer the recogniser one more view of each crop: the binarisation with the
  # ink bridges between tightly-set characters prised apart. This is the fix
  # for bold, tightly-spaced plates (the APP format), whose adjacent glyphs
  # weld into one blob at binarisation and then read as a dropped or invented
  # character rather than a confusable one.
  #
  # An extra view, not a replacement: the same repair applied to a delicate
  # font thins its strokes into gaps, so both go to the ensemble and agreement
  # between them decides. Nearly free on plates that do not need it -- a crop
  # with no bridge to break produces no extra view and no extra OCR pass.
  tight_font_variant: true
  # [width, height] of the structuring element for that repair. Vertical and
  # odd on purpose: two glyphs touch only over the few rows where their strokes
  # come closest, so the bridge is thin in y, not in x, and an odd height
  # erodes symmetrically instead of shifting every glyph half a pixel.
  # (1,3) clears bridges up to 2 rows thick. Raise to (1,5) for heavier
  # welding, at the cost of eating the horizontal bar of an E or F.
  tight_font_kernel: [1, 3]

ocr:
  # PaddleOCR by default. Measured against EasyOCR on 47 hand-labelled frames
  # from this installation: 95.7% plate accuracy against 38.3%, CER 0.6%
  # against 17.6%. EasyOCR needs no extra system packages and stays supported
  # -- switch this one line back if paddle cannot be installed on a box.
  # Re-measure per site:
  #   python scripts/evaluate.py --images data/snapshots \
  #       --truth data/ocr_ground_truth.json --compare-backends
  backend: paddleocr
  # true / false / auto. Same probe as detection.device above, so one config
  # file serves the GPU gate box, a CPU-only spare and CI. An explicit "true"
  # without a usable GPU is downgraded with a warning rather than obeyed --
  # EasyOCR raises from its constructor in that case, which would abort the
  # whole pipeline build rather than just slowing it down.
  gpu: auto
  # Weight cache. Blank = models/easyocr, which is a bind-mounted host volume,
  # so the ~100 MB of detection/recognition weights survive container rebuilds
  # instead of being re-downloaded on every cold start. Pre-fill it from the
  # host with `python scripts/fetch_models.py --easyocr`.
  model_dir: ""
  # Let EasyOCR fetch missing weights on first start. Once the cache is
  # complete the network path is switched off automatically regardless, so a
  # provisioned box opens no socket at startup. Set false to refuse the
  # download outright on an air-gapped site.
  allow_download: true
  # Bounds the weight download. EasyOCR calls urlretrieve with no timeout, so
  # a half-open connection would otherwise hang startup indefinitely -- past
  # the compose healthcheck, with no log line saying why. 0 = unbounded.
  download_timeout_s: 60.0
  min_confidence: 0.5
  allowlist: "ABCDEFGHIJKLMNOPRSTUVYZ0123456789"
  # How eagerly EasyOCR glues horizontally adjacent detection boxes together:
  # two boxes merge when the gap between them is under width_ths * box_height.
  #
  # NOTE the direction -- HIGHER MERGES MORE. Raising this to 0.6-0.7 makes
  # EasyOCR more willing to combine boxes, not less. Lower it (try 0.3) to
  # split the plate into more, smaller boxes.
  #
  # Left at EasyOCR's own default because it matters less here than it looks:
  # it groups *boxes*, whereas the characters that merge on a bold plate merge
  # inside one box at binarisation -- that is preprocess.tight_font_variant's
  # job. It also cannot lose a read, since the recogniser votes on each
  # fragment separately as well as on their concatenation.
  width_ths: 0.5
  ensemble_backends: []

voting:
  window: 5
  # Two agreeing reads, not three. After the positional repair in
  # lpr.ocr.normalize and the near-miss merge in lpr.ocr.voting, a third frame
  # almost never changes the answer -- it just costs another detection stride
  # with a car waiting at a closed gate. The check that actually guards the
  # barrier is that the plate has to be registered.
  min_votes: 2
  ttl_s: 4.0
  cooldown_s: 20.0
  max_track_attempts: 12
  track_ttl_s: 30.0
  # Open the gate on the first confident read of an already-registered plate,
  # instead of running the rest of the OCR ladder and waiting for min_votes
  # frames to agree. Applies only to plates the whitelist clears right now; a
  # stranger, a blocked plate and an expired permit all keep the full path.
  fast_path_enabled: true
  # Floored at ocr.min_confidence. 0.82 rather than the old 0.90: a clean,
  # well-lit plate on a registered car reads in the 0.82-0.90 band often
  # enough that the higher bar sent most of them round the full voting path
  # anyway, which is the latency this setting exists to remove. The misread
  # risk stays bounded by the whitelist check -- a wrong string has to spell a
  # plate that is actually registered at this site before anything moves.
  fast_path_confidence: 0.82
  # Whether a fast-path hit may open the barrier on a SINGLE frame,
  # skipping the multi-frame vote. Off: measured on 47 labelled frames,
  # correct reads scored 0.905-0.999 and the wrong ones 0.949/0.955, so
  # no confidence threshold separates them. The OCR early-exit half of
  # the fast path still runs either way.
  fast_path_opens_gate: false

relay:
  enabled: true
  # serial | gpio | modbus | http | mock | auto (auto = serial).
  driver: auto
  # Refuse to fall back to a mock relay. Turn this ON for every real site: a
  # mocked relay logs every vehicle as granted while no barrier moves, which
  # looks like success everywhere except at the gate. LPR_ENV=production
  # enables it regardless of this flag.
  require_hardware: false
  port: auto
  baud: 9600
  open_byte: "A"
  close_byte: "a"
  pulse_ms: 1000
  mock: false

smtp:
  enabled: true
  host: "smtp.gmail.com"
  port: 587
  user: "hasanefeavc@gmail.com"
  password: ""
  from_email: "hasanefeavc@gmail.com"
  to_emails: ["hasanefeavc198@gmail.com"]
  notify_on_unauthorized: true
  notify_on_blacklisted: true
  use_tls: true
  timeout_s: 15.0
  queue_size: 64

database:
  path: data/plates.db
  log_retention_days: 10

snapshots:
  enabled: true
  dir: ""
  # Three limits; the tightest wins. Age alone is not enough -- it bounds how
  # old the evidence gets, not how much of it there is, and a busy gate writes
  # tens of gigabytes inside a ten-day window. The snapshot directory and the
  # database usually share a volume, so snapshots filling the disk is what
  # stops the gate log being writable.
  retention_days: 10
  # Total ceiling for the snapshot directory, in MB. 0 disables. Enforced
  # oldest-first, so what survives is always the most recent evidence.
  max_total_mb: 20000
  # Keep at least this much free on the volume, in MB. 0 disables. Separate
  # from the ceiling above: this one notices the disk filling for reasons that
  # have nothing to do with snapshots.
  min_free_mb: 2000
  jpeg_quality: 80
  queue_size: 64

parking:
  capacity: 100

# Refuse a second entry for a vehicle the log says never left. Stops the oldest
# abuse in access control: a resident drives in and hands the car (or the
# plate) to somebody at the kerb.
#
# OFF by default, and it must stay off on a single-camera site. With no exit
# camera no exit is ever recorded, so every vehicle would look permanently
# inside and its second visit would be refused -- the orchestrator detects that
# and disables the rule with a warning rather than letting it happen.
#
# This NEVER blocks an exit. Not a policy choice: a vehicle that cannot leave
# is a vehicle trapped behind a barrier, and in a fire that is the failure that
# matters.
anti_passback:
  enabled: false
  # How long a vehicle counts as inside without an exit. A missed exit read --
  # a plate obscured by a following car -- must not strand a resident for ever,
  # so the state expires. 12 h covers a working day and clears overnight.
  window_s: 43200
  # Master override, separate from `enabled` so an operator flipping it in a
  # hurry does not have to remember the site's settings to put them back.
  emergency_bypass: false
  # Plates the rule never applies to: service vehicles, the site manager.
  exempt_plates: []

api:
  host: 0.0.0.0
  port: 8000
  # Empty = same-origin only, and that is the right default. The dashboard is
  # served by this very app at /web, so a site behind the shipped reverse proxy
  # needs no CORS at all and the safest configuration is the one that grants
  # nothing. This used to be ["*"], which granted every origin on the internet
  # read access to the API from any page a logged-in operator happened to open.
  #
  # Add the real origin(s) here -- e.g. https://gate.example.com -- only for a
  # front end hosted somewhere other than this service.
  cors_origins: []
  token_ttl_min: 720
  # MUST be replaced before this service binds to anything but loopback; the
  # value below is in the public repository, so a deployment that keeps it is
  # signing its sessions with a key anybody can look up. Startup refuses it --
  # see Settings._check_secret_key_in_production.
  #   openssl rand -hex 32
  # `python scripts/setup_dev.py` writes a generated one into .env for you.
  secret_key: change-me

system_update:
  # Off by default, and it must stay that way in the shipped file. Turning this
  # on exposes an authenticated endpoint that runs `git pull` and
  # `docker compose up --build` -- remote code execution by design. It also
  # requires the Docker/Podman socket to be mounted into the container, which
  # is host-root access.
  #
  # A site that wants OTA turns it on deliberately AND adds the socket mount
  # from docker/docker-compose.ota.yml. Shipping it enabled meant every
  # customer who installed this file as-is got the endpoint live without ever
  # having decided to.
  enabled: false
  repo_dir: "."
  git_remote: origin
  git_branch: main
  compose_file: docker/docker-compose.yml
  # Overlays merged over compose_file, in order, each as another -f. Whatever
  # you pass by hand belongs here too: this is what brings the service back up
  # after an update, so an omitted overlay is silently dropped on every rebuild.
  # On a Podman or CDI host that means losing the GPU:
  #   compose_overrides: ["docker/docker-compose.cdi.yml"]
  compose_overrides: []
  git_timeout_s: 120.0
  build_timeout_s: 900.0
  state_file: ""
  nightly_check: true
  auto_update: false
  check_hour: 3
  check_minute: 0
  event_retention_days: 90

security:
  password_hasher: argon2
