name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: a queued run against a
# superseded commit tells nobody anything and costs a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # The gate that must never be skipped: no credential may reach the repo.
  # Runs first and on its own, so a leak is reported in seconds rather than
  # after twelve minutes of installing torch.
  # ---------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_secrets.py walks `git log --all` looking for key material
          # and model weights. With the default shallow clone it would walk one
          # commit and pass on a repository whose history is full of them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Scan the tree and the history
        run: pytest tests/test_secrets.py -q

  # ---------------------------------------------------------------------
  # Everything that runs without an ML wheel installed. This is most of the
  # suite: the pure-python layers (normalisation, voting, dataset validation,
  # evaluation metrics, config, licensing) are deliberately importable with no
  # torch, and this job is what keeps them that way.
  # ---------------------------------------------------------------------
  lint-and-unit:
    name: Lint and unit tests (no ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyyaml pydantic pydantic-settings

      - name: Ruff
        run: ruff check .

      # The dashboard's stylesheet is generated from its markup and committed.
      # A class added to web/index.html without regenerating it ships as a
      # silently unstyled element, which no test that reads the HTML would
      # catch. Pure stdlib, so it belongs in the cheap job.
      - name: Dashboard stylesheet is current
        run: python scripts/build_web_css.py --check

      - name: Pure-python layers import without torch
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import lpr.dataset, lpr.evaluation, lpr.ocr.normalize, lpr.ocr.voting
          for name in ("torch", "cv2", "ultralytics", "easyocr", "numpy"):
              assert name not in sys.modules, (
                  f"{name} was imported as a side effect; these modules must stay "
                  "collectable on a runner with no ML wheels"
              )
          print("pure-python layers are clean")
          PY

      - name: Unit tests
        run: >-
          pytest tests/test_dataset.py tests/test_evaluation.py
          tests/test_normalize.py tests/test_voting.py
          tests/test_camera_sources.py tests/test_env_example.py -q

  # ---------------------------------------------------------------------
  # The full suite, with the ML stack. Slower and heavier, so it runs after
  # the two cheap jobs have had their say.
  # ---------------------------------------------------------------------
  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    needs: [secrets, lint-and-unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch, so the runner does not pull 2.5 GB of CUDA)
        env:
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url "$TORCH_INDEX_URL" -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Test
        run: pytest -q

      - name: Type check
        run: mypy src
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Accuracy regression. Skipped unless an evaluation set is actually present,
  # because a gate that silently passes on missing data is worse than no gate:
  # the `if` below makes the skip visible in the job list rather than hiding it
  # inside a step that exits 0.
  #
  # The set is not in the repository -- it is photographs of vehicles, which is
  # personal data, and it is far too large for git. Point EVAL_IMAGES at a
  # mounted volume or restore it from a release asset in a step here.
  # ---------------------------------------------------------------------
  accuracy:
    name: Accuracy gate
    runs-on: ubuntu-latest
    needs: [full-suite]
    if: ${{ vars.EVAL_IMAGES != '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url "$TORCH_INDEX_URL" -r requirements.txt
          pip install -e .

      - name: Fetch model weights
        run: python scripts/fetch_models.py --easyocr

      - name: Validate the evaluation dataset
        run: python scripts/fetch_dataset.py --check "${{ vars.EVAL_DATA_YAML }}"
        if: ${{ vars.EVAL_DATA_YAML != '' }}

      # Thresholds live in repository variables, not here, so tightening the
      # bar as the model improves is a settings change rather than a commit.
      # A metric that could not be measured fails its gate; see
      # scripts/evaluate.py check_thresholds.
      - name: Evaluate
        run: |
          python scripts/evaluate.py \
            --images "${{ vars.EVAL_IMAGES }}" \
            --truth "${{ vars.EVAL_TRUTH }}" \
            --device cpu \
            --json accuracy-report.json \
            --min-accuracy "${{ vars.MIN_PLATE_ACCURACY || '0.95' }}" \
            --max-false-positive "${{ vars.MAX_FALSE_POSITIVE || '0.005' }}" \
            --max-wrong-plate "${{ vars.MAX_WRONG_PLATE || '0.02' }}" \
            --max-latency-p95 "${{ vars.MAX_LATENCY_P95_MS || '1500' }}"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: accuracy-report.json
